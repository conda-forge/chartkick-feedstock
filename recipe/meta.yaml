{% set name = "chartkick" %}
{% set version = "1.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e815a11806ba541e31d32ecd583b76e54a7e929aaaab76972ae44f0d841c0df3

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python
    - pip
  run:
    - python

test:
  imports:
    - chartkick
    - chartkick.templatetags

about:
  home: https://pypi.org/project/chartkick
  license: MIT
  license_file: LICENSE
  summary: 'Create beautiful Javascript charts with minimal code'
  dev_url: https://github.com/mher/chartkick.py

extra:
  recipe-maintainers:
    - pmlandwehr
    - anthchirp
