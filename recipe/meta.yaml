{% set name = "chartkick" %}
{% set version = "1.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 66f1f01381c5fb7dbf61bd5e65cc2ec9bae085a5844c4b06ccc4d0f61f024cfa

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python
    - pip
  run:
    - python

test:
  imports:
    - chartkick
    - chartkick.templatetags

about:
  home: https://pypi.org/project/chartkick
  license: MIT
  license_file: LICENSE
  summary: 'Create beautiful Javascript charts with minimal code'
  dev_url: https://github.com/mher/chartkick.py

extra:
  recipe-maintainers:
    - pmlandwehr
    - anthchirp
